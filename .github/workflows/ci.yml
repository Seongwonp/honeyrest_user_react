# 프론트엔드 CI: master 브랜치 push / PR 시 린트와 프로덕션 빌드를 검증
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (.nvmrc 기준)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build
        env:
          # 빌드에 필요한 최소 환경변수 (나머지 VITE_* 값은 미설정 시 undefined로 처리되어 빌드에 영향 없음)
          VITE_BACKEND_URL: http://localhost:8080
