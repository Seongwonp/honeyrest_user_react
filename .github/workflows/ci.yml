# 프론트엔드 CI: master 브랜치 push / PR 시 린트·프로덕션 빌드(build)와 사용자 여정 E2E(e2e)를 검증
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (.nvmrc 기준)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build
        env:
          # 빌드에 필요한 최소 환경변수 (나머지 VITE_* 값은 미설정 시 undefined로 처리되어 빌드에 영향 없음)
          VITE_BACKEND_URL: http://localhost:8080

  # 사용자 여정 E2E: 사용자 API(e2e 프로필)와 프론트 개발 서버를 함께 띄워 Playwright 로 검증한다.
  # - API 저장소(Seongwonp/honeyRest_user)를 옆 디렉터리에 체크아웃한다 (서브모듈 불필요).
  #   API 저장소가 비공개라면 읽기 권한이 있는 토큰을 E2E_API_REPO_TOKEN 시크릿으로 등록한다.
  # - API 는 H2 인메모리 DB·인메모리 Redis·토스 스텁·메일 no-op 으로 기동하므로 서비스 컨테이너가 필요 없다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: honeyrest_user_react

    steps:
      - name: 프론트엔드 소스 체크아웃
        uses: actions/checkout@v4
        with:
          path: honeyrest_user_react

      - name: 사용자 API 소스 체크아웃
        uses: actions/checkout@v4
        with:
          repository: Seongwonp/honeyRest_user
          ref: main
          path: honeyRest_user
          submodules: false
          token: ${{ secrets.E2E_API_REPO_TOKEN || github.token }}

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: honeyRest_user

      - name: Node.js 설정 (.nvmrc 기준)
        uses: actions/setup-node@v4
        with:
          node-version-file: honeyrest_user_react/.nvmrc
          cache: npm
          cache-dependency-path: honeyrest_user_react/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 사용자 API 미리 컴파일 (webServer 기동 대기 시간 단축)
        working-directory: honeyRest_user
        run: ./gradlew classes --no-daemon

      - name: E2E 테스트
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_API_DIR: ../honeyRest_user

      - name: 실패 시 Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            honeyrest_user_react/playwright-report/
            honeyrest_user_react/test-results/
          retention-days: 7
